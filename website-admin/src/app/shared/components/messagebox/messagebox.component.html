<ng-template appAnchorHost></ng-template>
<div class="mt-3 text-center" algin="center">
  <button
    type="button"
    class="btn btn-reset mr-3 w-80px"
    mat-dialog-close
    *ngIf="data?.btnOk"
    (click)="data?.btnClose?.callBack && data.btnClose.callBack()"
  >
    {{ labelClose }}
  </button>
  <button
    type="button"
    class="btn btn-apply w-80px"
    mat-dialog-close
    *ngIf="data?.btnClose"
    (click)="data?.btnOk?.callBack && data.btnOk.callBack()"
  >
    {{ labelOk }}
  </button>
</div>
