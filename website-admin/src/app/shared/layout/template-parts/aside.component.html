<ul nz-menu nzTheme="dark" nzMode="inline">
    <ng-container *ngTemplateOutlet="menuTpl; context: { $implicit: menus }"></ng-container>
    <ng-template #menuTpl let-menus>
        <ng-container *ngFor="let menu of menus">
            <li *ngIf="!menu.children && menu.isPermission" nz-menu-item [nzPaddingLeft]="menu.level * 24"
                [nzDisabled]="menu.disabled" [nzSelected]="menu.selected" [routerLink]="menu.route">
                <i nz-icon [nzType]="menu.icon" *ngIf="menu.icon"></i>
                <span>{{ menu.title }}</span>
            </li>
            <li *ngIf="menu.children && menu.isPermission" nz-submenu [nzPaddingLeft]="menu.level * 24"
                [nzOpen]="menu.open" [nzTitle]="menu.title" [nzIcon]="menu.icon" [nzDisabled]="menu.disabled" (click)="onClickMenu(menu)">
                <ul>
                    <ng-container *ngTemplateOutlet="menuTpl; context: { $implicit: menu.children }"></ng-container>
                </ul>
            </li>
        </ng-container>
    </ng-template>
</ul>
