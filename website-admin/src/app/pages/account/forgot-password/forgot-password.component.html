<section class="login">
  <div class="container-custom">
    <h1 class="title">Quên mật khẩu</h1>
    <p>Vui lòng nhập email để lấy lại mật khẩu</p>
    <img src="./assets/images/logo.png" alt="" class="img-fluid d-block mx-auto">
    <form>
      <div class="form-group">
        <label for="email">Email<span>*</span></label>
        <div class="input-custom">
          <img src="./assets/images/email-green-icon.svg" alt="" class="lock">
          <input 
            type="text" 
            class="form-control" 
            id="email" 
            placeholder="Nhập email" 
            [(ngModel)]="email" 
            name="email" 
            autofocus 
            required 
            (keyup.enter)="submit()">
        </div>
      </div>
    </form>
    <button type="button" class="btn btn-common" (click)="submit()">
      Xác nhận
    </button>
    <button type="button" class="btn btn-cancel mt-2" routerLink="/account/login">
      Quay lại
    </button>
  </div>
</section>
