<section class="login">
  <div class="container-custom">
    <h1 class="title">Tạo mật khẩu mới</h1>
    <p>Vui lòng tạo mật khẩu mới để truy cập</p>
    <img src="./assets/images/logo.png" alt="" class="img-fluid d-block mx-auto" />
    <form>
      <div class="form-group">
        <label for="password">Mật khẩu<span>*</span></label>          
        <div class="input-custom">
          <img src="./assets/images/lock-icon-login.svg" alt="">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" 
            placeholder="Nhập mật khẩu" 
            [(ngModel)]="vm.password" 
            name="password" required >
            <button type="button" class="btn btn-eye p-0" (click)="togglePasswordVisibility()">
              <img src="./assets/icons/visibility-off.svg" alt="" class="mr-0">
            </button>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Xác nhận mật khẩu<span>*</span></label>          
        <div class="input-custom">
          <img src="./assets/images/lock-icon-login.svg" alt="">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" id="password" 
            placeholder="Nhập mật khẩu" 
            [(ngModel)]="confirmPassword"
            name="password" required >
            <button type="button" class="btn btn-eye p-0" (click)="toggleConfirmPasswordVisibility()">
              <img src="./assets/icons/visibility-off.svg" alt="" class="mr-0">
            </button>
        </div>
      </div>
    </form>
    <button type="button" class="btn btn-common" (click)="submit()">Xác nhận</button>
  </div>
</section>
