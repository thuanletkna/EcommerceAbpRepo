<form #formEdit="ngForm" nz-form [nzLayout]="'vertical'">
    <div class="container-edit my-4">
      <div class="card">
        <div class="card-header bg-white">
          Thêm Hình Ảnh
        </div>
        <div class="row p-3">
          
          <div class="col-md-6">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Tên banner' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <input
                  maxlength="255"
                  nz-input
                  name="name"
                  type="text"
                  [(ngModel)]="vm.name"
                  required
                />
              </nz-form-control>
            </nz-form-item>
          </div>
  
          
          <div class="col-md-12">
            <nz-form-item>
              <nz-form-label>{{ '::Chi Tiết' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <textarea nz-input name="description" type="text" [(ngModel)]="vm.description"></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>
          
            
          <div class="col-6 mt-2">
            <nz-form-item class="w-100">
              <nz-form-label>Banner Slide Trang Chủ</nz-form-label>
              <nz-form-control>
                <div *ngFor="let item of bannerFiles; index as i" class="d-flex align-items-center">
                  <upload-file
                    name="imageSetting{{ i }}"
                    [(ngModel)]="item.fileStorageId"
                    style="float: left"
                    [autoUpload]="true"
                    [typeFile]="'BannerSlide'"
                    [accept]="'.jpg, .jpeg, .png, .bmp, .gif'" 
                  ></upload-file>
                  <button
                    *ngIf="vm.imageSetting !== null"
                    mat-icon-button
                    type="button"
                    (click)="remove(item)">
                    <div class="icon-delete-red size-14"></div>
                  </button>
                </div>
              </nz-form-control>
            </nz-form-item>
            <div class="d-flex align-items-center justify-content-between" *ngIf="this.bannerFiles.length >-1">
              <button
                type="button"
                class="btn btn-add-more"
                (click)="add('BannerSlide')"
                [disabled]="disableSave">
                <div class="icon-add mr-2"></div>
                Add more file
              </button>
            </div>
          </div>

          <div class="col-6 mt-2">
            <nz-form-item class="w-100">
              <nz-form-label>Banner Header Trang Chủ</nz-form-label>
              <nz-form-control>
                <div *ngFor="let item of bannerProduct; index as i" class="d-flex align-items-center" >
                  <upload-file
                    name="imageSetting{{ i }}"
                    [(ngModel)]="item.fileStorageId"
                    style="float: left"
                    [autoUpload]="true"
                    [typeFile]="'BannerHeader'"
                    [accept]="'.jpg, .jpeg, .png, .bmp, .gif'" 
                  ></upload-file>
                  <button
                    *ngIf="vm.imageSetting !== null"
                    mat-icon-button
                    type="button"
                    (click)="removeProduct(item)">
                    <div class="icon-delete-red size-14"></div>
                  </button>
                </div>
              </nz-form-control>
            </nz-form-item>
            <div class="d-flex align-items-center justify-content-between" *ngIf="this.bannerProduct.length <1">
              <button
                type="button"
                class="btn btn-add-more"
                (click)="addProduct('BannerHeader')"
                [disabled]="disableSave">
                <div class="icon-add mr-2"></div>
                Add more file
              </button>
            </div>
          </div>

          <div class="col-6 mt-2">
            <nz-form-item class="w-100">
              <nz-form-label>Logo</nz-form-label>
              <nz-form-control>
                <div *ngFor="let item of bannerLogo; index as i" class="d-flex align-items-center" >
                  <upload-file
                    name="imageSetting{{ i }}"
                    [(ngModel)]="item.fileStorageId"
                    style="float: left"
                    [autoUpload]="true"
                    [typeFile]="'Logo'"
                    [accept]="'.jpg, .jpeg, .png, .bmp, .gif'" 
                  ></upload-file>
                  <button
                    *ngIf="vm.imageSetting !== null"
                    mat-icon-button
                    type="button"
                    (click)="removeLogo(item)">
                    <div class="icon-delete-red size-14"></div>
                  </button>
                </div>
              </nz-form-control>
            </nz-form-item>
            <div class="d-flex align-items-center justify-content-between" *ngIf="this.bannerLogo.length <1">
              <button
                type="button"
                class="btn btn-add-more"
                (click)="addLogo('Logo')"
                [disabled]="disableSave">
                <div class="icon-add mr-2"></div>
                Add more file
              </button>
            </div>
          </div>
        </div>
        <hr />
      </div>
      <div class="row mt-3">
        <div class="col-md">(<span class="required">*</span>) Required information</div>
        <div class="col-md text-right w-100 action-filter pt-0">
          <!-- <button type="button" class="btn btn-reset" (click)="reset()">Reset</button> -->
          <button type="button" class="btn btn-reset" (click)="goback()">Cancel</button>
          <button class="btn btn-apply ml-3" (click)="save()">Save</button>
        </div>
      </div>
    </div>
  </form>
