<form #formEdit="ngForm" nz-form [nzLayout]="'vertical'">
    <div class="container-edit my-4">
      <div class="card">
        <div class="row p-3">
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Số điện thoại' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <nz-input-number class="w-100" name="phone" 
                  [(ngModel)]="vm.phone" required></nz-input-number>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Zalo' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <input nz-input name="zalo" type="text" [(ngModel)]="vm.zalo" required>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Email' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <input nz-input name="email" type="text" [(ngModel)]="vm.email" required>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Facebook' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <input nz-input name="facebook" type="text" [(ngModel)]="vm.facebook" required>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Shopee' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <input nz-input name="shopee" type="text" [(ngModel)]="vm.shopee" required>
              </nz-form-control>
            </nz-form-item>
          </div>
          <div class="col-12">
            <nz-form-item>
              <nz-form-label nzRequired>{{ '::Giới thiệu trang web' | abpLocalization }}</nz-form-label>
              <nz-form-control>
                <textarea nz-input name="descriptions" type="text" [(ngModel)]="vm.descriptions" required></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>
          
        </div> 
      </div>
      <div class="row mt-3">
        <div class="col-md">
          (<span class="required">*</span>) Required information
        </div>
        <div class="col-md text-right w-100 action-filter pt-0">
          <button type="button" class="btn btn-reset" (click)="goback()">Cancel</button>
          <button class="btn btn-apply ml-3" (click)="save()">Save</button>
        </div>
      </div>
    </div>
</form>
