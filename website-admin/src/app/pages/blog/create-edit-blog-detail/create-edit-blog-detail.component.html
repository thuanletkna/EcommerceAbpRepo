<h1 mat-dialog-title>
    {{ (vm.id ? '::Chỉnh sửa' : '::Thêm mới') | abpLocalization: l('::Action') }}
  </h1>
  <div mat-dialog-content>
    <form #formEdit="ngForm" nz-form [nzLayout]="'vertical'" class="my-3">
      <div class="row p-3">
        <div class="col-12">
          <nz-form-item>
            <nz-form-label nzRequired>{{ '::Title chi tiết bài đăng' | abpLocalization }}</nz-form-label>
            <nz-form-control>
              <input
                nz-input
                name="name"
                type="text"
                [(ngModel)]="vm.name"
                required
                maxlength="1000"
              />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="col-12">
          <nz-form-item>
            <nz-form-label>{{ '::Thứ tự' | abpLocalization }}</nz-form-label>
            <nz-form-control>
              <input
                nz-input
                name="code"
                type="text"
                [(ngModel)]="vm.code"
                maxlength="1000"
              />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div>
            <div class="col-12">
              <nz-form-item>
                <nz-form-label nzRequired>Chi tiết bài đăng</nz-form-label>
                <nz-form-control>
                  <richtextbox maxlength="2000" name="detail" [(ngModel)]="vm.details" [height]="250"></richtextbox>
                </nz-form-control>
              </nz-form-item>
            </div>
        </div>
       
          <div class="col-12 mt-2">
            <nz-form-item>
                <nz-form-label>{{ '::Trạng thái' | abpLocalization }}</nz-form-label>
                <nz-radio-group [(ngModel)]="vm.status" name="status">
                    <label nz-radio [nzValue]="1">{{ '::Enum:Status_1' | abpLocalization }}</label>
                    <label nz-radio [nzValue]="0">{{ '::Enum:Status_0' | abpLocalization }}</label>
                </nz-radio-group>
            </nz-form-item>
        </div>

        <div nz-col [nzSpan]="24">
          <div class="row px-3 pb-3">
            <div class="col-12 d-flex align-items-center justify-content-between">
              <h5 class="font-weight-bolder">Danh sách sản phẩm Affilate</h5>
              <button class="btn btn-add-new" (click)="addProductAffilate()">
                <i class="fas fa-plus mr-1"></i>
                Thêm sản phẩm Affilate
              </button>
            </div>
          </div>
          <datatable [source]="vm.productAffilates" [option]="selectionTableOptions"></datatable>
        </div>
      </div>
      <div class="row p-3">
        <div class="col-12">(<span class="required">*</span>) Không được để trống</div>
      </div>
    </form>
  </div>
  
  <mat-dialog-actions align="end">
    <button class="btn btn-reset" type="button" mat-dialog-close>Trở về</button>
    <button class="btn btn-apply ml-3" type="button" (click)="save()">Lưu</button>
  </mat-dialog-actions>
