<nz-card nzType="inner" nzTitle="Quản lý Danh Mục Sản Phẩm" [nzExtra]="extraTemplate">
    <div class="body">
        <div class="card my-4 pb-4">
            <div class="card-header bg-white d-flex align-items-center justify-content-between">
                <div>Search/Filter</div>
                <div class="text-right">
                    <button type="button" class="btn btn-reset" (click)="keyword = null;  table.refresh()">
                        Reset
                    </button>
                    <button type="button" class="btn btn-apply ml-2" (click)="table.refresh()">
                        Apply
                    </button>
                </div>
            </div>
            <div class="p-3">
                <div class="w-100">
                    <div class="row">
                        <div class="col-md-8">
                            <label>{{ '::Keyword' | abpLocalization }}</label>
                            <input nz-input placeholder="Enter location name/ description" name="Keyword" [(ngModel)]="keyword" (keyup.enter)="table.refresh()"/>
                        </div>
                        <div class="col-md-4">
                            <label>{{ '::Status' | abpLocalization }}</label>
                            <nz-select [(ngModel)]="status" nzShowSearch class="w-100" (ngModelChange)="table.refresh()">
                                <nz-option *ngFor="let item of listStatus" [nzValue]="item" nzLabel="{{getStatus(item)}}"></nz-option>
                            </nz-select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
      <div class="card mb-4">
        <div class="card-header bg-white">Result</div>
        <datatable [option]="tableOptions"></datatable>
      </div>
    </div>
  </nz-card>
  
  <ng-template #extraTemplate>
    <button nz-button nzType="primary" (click)="create()">
      <i nz-icon nzType="plus" nzTheme="outline"></i>Thêm
    </button>
  </ng-template>
