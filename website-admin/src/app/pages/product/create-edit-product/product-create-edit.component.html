<!-- <nz-card nzType="inner" nzTitle="Thêm Sản Phẩm" [nzExtra]="extraTemplate"> -->
  <nz-card nzType="inner" nzTitle="Thêm Sản Phẩm" >
    <div class="body">
        <form #formEdit="ngForm" nz-form [nzLayout]="'vertical'">
            <div nz-row [nzGutter]="24">
                    <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Tên sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="name" type="text" [(ngModel)]="vm.name" required autofocus [disabled]="vm?.id">
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Mã sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Slug</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="24" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Mô tả ngắn</nz-form-label>
                      <nz-form-control>
                        <textarea nz-input name="description" type="text" [(ngModel)]="vm.description" required></textarea>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Loại sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Thuộc tính</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Thương hiệu</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Giá gốc</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Giá bán</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số lượng</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số người mua</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Lượt đánh giá</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số sao đánh giá</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Video sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Ảnh bìa sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Ảnh phụ sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="24" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Chi tiết sản phẩm</nz-form-label>
                      <nz-form-control>
                        <richtextbox maxlength="2000" name="detail" [(ngModel)]="vm.detail" [height]="400"></richtextbox>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  
              <!-- <div class="d-flex justify-content-between mt-3">
                <div>
                  (<span class="required">*</span>) Thông tin bắt buộc
                </div>
              </div> -->
            </div>
            <div class="row mt-3">
              <!-- <div class="d-flex justify-content-between mt-3"> -->
                <div class="col-md"> 
                  (<span class="required">*</span>) Required information
                </div>
                <div class="col-md text-right w-100 action-filter pt-0">
                  <button type="button" class="btn btn-reset" (click)="goback()">Cancel</button>
                  <button *ngIf="canSave" class="btn btn-apply ml-3" (click)="save()">{{ id ? 'Update' : 'Add new'}}</button>
                </div>
              </div>
          </form>
    </div>
  </nz-card>
