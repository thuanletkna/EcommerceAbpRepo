<!-- <nz-card nzType="inner" nzTitle="Thêm Sản Phẩm" [nzExtra]="extraTemplate"> -->
  <nz-card nzType="inner" nzTitle="Thêm Sản Phẩm" >
    <div class="body">
        <form #formEdit="ngForm" nz-form [nzLayout]="'vertical'">
            <div nz-row [nzGutter]="24">
                    <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Tên sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="name" type="text" [(ngModel)]="vm.name" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Mã sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="productCode" type="text" [(ngModel)]="vm.productCode" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Slug</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="slug" type="text" [(ngModel)]="vm.slug" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="24" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Mô tả ngắn</nz-form-label>
                      <nz-form-control>
                        <textarea nz-input name="description" type="text" [(ngModel)]="vm.description" required></textarea>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>{{ '::Danh mục sản phẩm' | abpLocalization }}</nz-form-label>
                      <nz-form-control>
                        <nz-select name="categoryId" [(ngModel)]="vm.categoryId" nzShowSearch required>
                          <nz-option
                            *ngFor="let category of categories"
                            [nzValue]="category.id"
                            [nzLabel]="category.name"
                          ></nz-option>
                        </nz-select>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Thuộc tính</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="productTypeId" type="text" [(ngModel)]="vm.productTypeId" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>{{ '::Thương hiệu' | abpLocalization }}</nz-form-label>
                      <nz-form-control>
                        <nz-select name="tradeMarkId" [(ngModel)]="vm.tradeMarkId" nzShowSearch required>
                          <nz-option
                            *ngFor="let trademark of trademarks"
                            [nzValue]="trademark.id"
                            [nzLabel]="trademark.name"
                          ></nz-option>
                        </nz-select>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Giá gốc</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="price" type="text" [(ngModel)]="vm.price" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Giá bán</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="priceSale" type="text" [(ngModel)]="vm.priceSale" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số lượng</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="quantity" type="text" [(ngModel)]="vm.quantity" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số người mua</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="view" type="text" [(ngModel)]="vm.viewCount" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Lượt đánh giá</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="numberOfReview" type="text" [(ngModel)]="vm.numberOfReview" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Số sao đánh giá</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="starRating" type="text" [(ngModel)]="vm.starRating" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Video sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Ảnh bìa sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="8" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Ảnh phụ sản phẩm</nz-form-label>
                      <nz-form-control>
                        <input nz-input name="description" type="text" [(ngModel)]="vm.description" required>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
                  <div nz-col [nzSpan]="24" >
                    <nz-form-item>
                      <nz-form-label nzRequired>Chi tiết sản phẩm</nz-form-label>
                      <nz-form-control>
                        <richtextbox maxlength="2000" name="detail" [(ngModel)]="vm.detail" [height]="400"></richtextbox>
                      </nz-form-control>
                    </nz-form-item>
                  </div>
            </div>
            <div class="row mt-3">
              <!-- <div class="d-flex justify-content-between mt-3"> -->
                <div class="col-md"> 
                  (<span class="required">*</span>) Thông tin bắt buộc
                </div>
                <div class="col-md text-right w-100 action-filter pt-0">
                  <button type="button" class="btn btn-reset" (click)="goback()">Cancel</button>
                  <button *ngIf="canSave" class="btn btn-apply ml-3" (click)="save()">{{ id ? 'Update' : 'Add new'}}</button>
                </div>
              </div>
          </form>
    </div>
  </nz-card>
