<form #formEdit="ngForm" nz-form [nzLayout]="'vertical'">
  <div class="container-edit my-4">
    <div class="card">
      <div class="row p-3">
        <!-- <div class="col-12">
          <nz-form-item>
            <nz-form-label nzRequired>Order Index</nz-form-label>
            <nz-form-control>
              <input nz-input name="orderIndex" type="number" min="0" [(ngModel)]="vm.orderIndex" required>
            </nz-form-control>
          </nz-form-item>
        </div> -->
        <div class="col-12">
          <nz-form-item>
            <nz-form-label nzRequired>Category Name</nz-form-label>
            <nz-form-control>
              <input nz-input name="name" type="text" [(ngModel)]="vm.name" required>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="col-12 mt-2">
          <nz-form-item>
            <nz-form-label>{{ '::Status' | abpLocalization }}</nz-form-label>
            <nz-radio-group [(ngModel)]="vm.status" name="status">
              <label nz-radio [nzValue]="1">{{ '::Enum:Status_1' | abpLocalization }}</label>
              <label nz-radio [nzValue]="0">{{ '::Enum:Status_0' | abpLocalization }}</label>
            </nz-radio-group>
          </nz-form-item>
        </div>
      </div>
      <div *ngIf="vm.id">
        <div class="d-flex align-items-center justify-content-between">
          <div class="pl-4">
            <strong>Sub-category listing</strong>
          </div>
          <div class="pr-1">
            <button type="button" class="btn btn-add-more" (click)="create()">
              <div class="icon-add mr-2"></div>
              Add Sub-category
            </button>
          </div>
        </div>
        <datatable [option]='tableOptions'></datatable>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md">
        (<span class="required">*</span>) Required information
      </div>
      <div class="col-md text-right w-100 action-filter pt-0">
        <button type="button" class="btn btn-reset" (click)="goback()">Cancel</button>
        <button *ngIf="canSave" class="btn btn-apply ml-3" (click)="save()">{{ id ?
          'Update' : 'Add new'}}</button>
      </div>
    </div>
  </div>
</form>
