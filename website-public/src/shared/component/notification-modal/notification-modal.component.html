<div *ngIf="isShow" class="modal fade" 
  id="notificationModal" 
  data-backdrop="static" 
  data-keyboard="false" 
  aria-hidden="true" 
  tabindex="-1" aria-lab
  elledby="notificationModalLabel" 
  aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-0">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <img src="./assets/images/close-modal-follow.svg" alt="">
        </button>
      </div>

      <div class="modal-body text-center">
        <h3 class="title">{{ vm.title }}</h3>
        <p>{{ vm.message }}</p>
        <button class="btn btn-update" data-dismiss="modal" (click)="buttonClick()">
          {{ vm.buttonText }}
        </button>
      </div>
    </div>
  </div>
</div>
