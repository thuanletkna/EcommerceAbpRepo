<div *ngIf="showPaging" class="pagination">
  <li class="page-item"  *ngIf="currentPage > 1"><a class="page-link page-links"
    routerLink="." 
    [queryParams]="{page: currentPage - 1}" 
    [queryParamsHandling]="'merge'" 
    [relativeTo]="activatedRoute"><i class='bx bx-chevrons-left'></i></a>
  </li>
  
  <ng-container *ngFor="let page of pageNumbers">
    <li class="page-item current" *ngIf="page.page;else dotPage" >
      <a class="page-link" routerLink="." 
      [queryParams]="{page: page.page}" 
      [queryParamsHandling]="'merge'" 
      [relativeTo]="activatedRoute"
      [ngClass]="page.class" [attr.title]="'Trang ' + page.text">{{ page.text }}</a>
    </li>
    <ng-template #dotPage>
      <a [ngClass]="page.class" [attr.title]="'...'">{{ page.text }}</a>
    </ng-template>
  </ng-container>


  <!-- <a *ngIf="currentPage< totalPage" -->
    <li class="page-item" *ngIf="currentPage < totalPage">
      <a class="page-link" routerLink="." 
      [queryParams]="{page: currentPage + 1}" 
      [queryParamsHandling]="'merge'" 
      [relativeTo]="activatedRoute"><i class='bx bx-chevrons-right'></i></a>
    </li>
    
</div>
