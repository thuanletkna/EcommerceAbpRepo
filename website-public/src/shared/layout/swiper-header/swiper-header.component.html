  <div class="blog-area " style="background-color: #fafdff;">
    <div class="container">
      <div class="row pt-45">
        <div class="col-lg-4 col-md-6" *ngFor="let items of imageHeader">
          <div class="blog-card"  style="background-color: #d37873;" *ngFor="let imageheader of items.imageSetting">
              <img style="width: 100%;height: 300px;" [src]="getLinkMedia(imageheader.fileStorageId)" alt="Images" />
          </div>
        </div>
        <div class="col-lg-8 col-md-6" >
          <div class="blog-card">
            <swiper  
              [spaceBetween]="100"
              [centeredSlides]="true"
              [autoplay]="{
                delay: 2500,
                disableOnInteraction: false
              }"
              [pagination]="{
                clickable: true
              }"
              [navigation]="true"
              class="mySwiper"
            >
              <ng-template *ngFor="let item of homepage"  swiperSlide >
                <div *ngFor="let image of item.imageSetting">
                  <img style="width: 100%;height: 300px;"    [src]="getLinkMedia(image.fileStorageId)">
                </div>
              </ng-template>
            </swiper>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
