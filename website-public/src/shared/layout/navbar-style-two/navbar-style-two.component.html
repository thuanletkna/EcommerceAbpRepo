<div class="navbar-area">
    <div class="mobile-nav" *ngFor="let items of logo">
        <ng-container *ngFor="let imagelogo of items.imageSetting">
            <a routerLink="/" class="logo"><img style="width: 110px;height: 35px;" [src]="getLinkMedia(imagelogo.fileStorageId)" alt="Logo"></a>
        </ng-container>
    </div>

    <div class="main-nav">
        <div class="container">
            <nav class="navbar navbar-expand-md navbar-light " *ngFor="let itemlogo of logo">
                <ng-container *ngFor="let imageslogo of itemlogo.imageSetting">
                    <a routerLink="/" class="navbar-brand"><img style="width: 131px;height: 42px;" [src]="getLinkMedia(imageslogo.fileStorageId)" alt="Logo"></a>
                </ng-container>
                <!-- <a class="navbar-brand" routerLink="/"><img src="assets/img/logo.png" alt="Logo"></a> -->

                <div class="collapse navbar-collapse mean-menu" id="navbarSupportedContent">
                    <ul class="navbar-nav m-auto">
                        <li class="nav-item"><a routerLink="/" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">Trang chủ</a></li>
                        <li class="nav-item"  >
                            <a href="javascript:void(0)" routerLink="/danh-sach-san-pham" class="nav-link">Sản phẩm <i class='bx bx-plus'></i></a>

                            <ul class="dropdown-menu">
                                <li class="nav-item" *ngFor="let cateProduct of categoriesProduct"><a [routerLink]="getPathProductByCategoryId(cateProduct.slug)" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">{{ cateProduct.name }}</a></li>

                                <!-- <li class="nav-item"><a routerLink="/home-two" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">Home Two</a></li>

                                <li class="nav-item"><a routerLink="/home-three" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">Home Three</a></li> -->
                            </ul>
                        </li>

                        <li class="nav-item">
                            <a href="javascript:void(0)" class="nav-link">Bài đăng <i class='bx bx-plus'></i></a>
                            
                            <ul class="dropdown-menu">
                                <li class="nav-item" *ngFor="let cateBlog of categoriesBlog"><a [routerLink]="getPathBlogByCategoryId(cateBlog.slug)" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">{{ cateBlog.name }}</a></li>
                            </ul>
                        </li>


                        <li class="nav-item"><a routerLink="/gioi-thieu" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">Giới thiệu</a></li>

                        <!-- <li class="nav-item"><a routerLink="/lien-he" class="nav-link" routerLinkActive="active"[routerLinkActiveOptions]="{exact: true}">Liên hệ</a></li> -->
                    </ul>
