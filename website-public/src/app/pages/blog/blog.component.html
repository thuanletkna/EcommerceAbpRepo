
<swipe-header></swipe-header>

    <div class="container">

              <div class="row">
                <div class="col-lg-6 col-md-6" *ngFor="let item of blogs.items">
                  <div class="blog-card">
                    <a [routerLink]="getPathBlogDetail(item.slug)" *ngFor="let filePr of item.blogFile"
                      ><img
                        style="height: 255px; width: 366px"
                        [src]="getLinkMedia(filePr.fileStorageId)"
                        alt="Blog Images"
                    /></a>
          
                    <div class="blog-content">
                      <a [routerLink]="getPathBlogDetail(item.slug)"><h3 class="split-string-name">{{ item.name }}</h3></a>
                      <!-- <ul class="blog-admin">
                                      <li><a routerLink="/"><i class='bx bxs-user'></i> Admin</a></li>
                                      <li><i class='bx bx-calendar-alt' ></i> 18 May 2020</li>
                                  </ul> -->
                      <p class="split-string">{{ item.descriptions }}</p>
                      <a [routerLink]="getPathBlogDetail(item.slug)" class="read-more-btn">
                        Xem chi tiết <i class="bx bxs-chevrons-right"></i></a>
                    </div>
                  </div>
                </div>
                <pagination
                  [totalCount]="blogs.totalCount"
                  [pageSize]="pageSize"
                ></pagination>
              </div>
              
            </div>

            <div class="col-lg-4">
                <div class="widget-area">
                    <div class="widget widget_search">
                        <h3 class="widget-title">Tìm kiếm bài đăng</h3>
                        <div class="post-wrap">
                            <form class="search-form">
                                <label>
                                    <span class="screen-reader-text">Search for:</span>
                                    <input type="search" class="search-field" placeholder="Nhập từ khóa...">
                                </label>
                                <button type="submit"><i class='bx bx-search'></i></button>
                            </form>
                        </div>
                    </div>
